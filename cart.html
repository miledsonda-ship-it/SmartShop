<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartShop - Panier</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <h1 class="logo"><a href="index.html">SmartShop</a></h1>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="shop.html">Boutique</a></li>
                <li><a href="about.html">À propos</a></li>
                <li><a href="cart.html">Panier</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </div>
</header>

<section class="container">
    <h2>Votre panier</h2>
    <ul id="cart-list"></ul>
    <button id="clear-cart" class="btn">Vider le panier</button>
    <a href="shop.html" class="btn" style="background-color: #3498db; margin-left: 10px;">Continuer vos achats</a>
</section>

<script>
    const cartList = document.getElementById("cart-list");
    const clearBtn = document.getElementById("clear-cart");
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    if (cart.length === 0) {
        cartList.innerHTML = "<li>Votre panier est vide</li>";
    } else {
        cart.forEach(item => {
            const li = document.createElement("li");
            li.textContent = item.name + " - " + item.price;
            cartList.appendChild(li);
        });
    }

    clearBtn.addEventListener("click", () => {
        localStorage.removeItem("cart");
        location.reload();
    });
</script>
</body>
</html>
